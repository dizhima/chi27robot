[project]
name = "mujoco-skill-playground"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "gymnasium-robotics>=1.4.2",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.11.1",
    "mujoco>=3.10.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "truststore>=0.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
